<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title description">
  <title id="title">Mihir Kaushal</title>
  <desc id="description">A navy and teal banner for software development, full-stack engineering, and data science.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061747"/>
      <stop offset="0.58" stop-color="#0b2869"/>
      <stop offset="1" stop-color="#123783"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(940 115) rotate(145) scale(420 245)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3aa8a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3aa8a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59d3cf"/>
      <stop offset="1" stop-color="#319a9a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a6b9ef" stroke-opacity="0.075"/>
    </pattern>
    <clipPath id="bannerClip">
      <rect width="1200" height="260" rx="28"/>
    </clipPath>
  </defs>

  <style>
    .gradient-drift {
      animation: gradient-drift 20s ease-in-out infinite;
    }

    .logo-float {
      animation: logo-float 6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes gradient-drift {
      0%, 100% { transform: translateX(-70px); }
      50% { transform: translateX(70px); }
    }

    @keyframes logo-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .gradient-drift,
      .logo-float {
        animation: none;
      }
    }
  </style>

  <g clip-path="url(#bannerClip)">
    <rect width="1200" height="260" fill="#061747"/>
    <rect class="gradient-drift" x="-160" width="1520" height="260" fill="url(#background)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="258" rx="27" fill="none" stroke="#9fb8ff" stroke-opacity="0.2" stroke-width="2"/>

  <g transform="translate(68 64)">
    <g class="logo-float">
      <rect width="132" height="132" rx="32" fill="#071a4c" fill-opacity="0.82" stroke="url(#accent)" stroke-width="2"/>
      <text x="66" y="84" fill="url(#accent)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="49" font-weight="750" letter-spacing="-3" text-anchor="middle">MK</text>
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="238" y="102" fill="#f5f7ff" font-size="52" font-weight="700" letter-spacing="-1.5">Mihir Kaushal</text>
    <text x="240" y="143" fill="#b9c8ef" font-size="21" font-weight="500" letter-spacing="2.3">SOFTWARE DEVELOPMENT  ·  FULL-STACK  ·  DATA SCIENCE</text>

    <g transform="translate(240 169)" font-size="13" font-weight="600" letter-spacing="0.5">
      <rect width="296" height="36" rx="18" fill="#319a9a" fill-opacity="0.16" stroke="#59d3cf" stroke-opacity="0.48"/>
      <text x="148" y="23" fill="#d8fffd" text-anchor="middle">UNIVERSITY OF WISCONSIN–MADISON</text>
      <rect x="308" width="324" height="36" rx="18" fill="#319a9a" fill-opacity="0.16" stroke="#59d3cf" stroke-opacity="0.48"/>
      <text x="470" y="23" fill="#d8fffd" text-anchor="middle">COMPUTER SCIENCES + DATA SCIENCE</text>
    </g>
  </g>
</svg>
